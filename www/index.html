<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>تطبيق الصلاة والقبلة</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg-color:#121212;--card-bg:#1e1e1e;--text-main:#f8fafc;--text-muted:#94a3b8;--primary:#d4af37;--primary-dark:#bda028;--border:#333;--box-bg-1:#242424;--box-bg-2:#0f0f0f;--card-grad-1:#222;--card-grad-2:#181818;--shadow-1:#0a0a0a;--shadow-2:#2a2a2a;--compass-bg:#121212}
[data-theme=blue]{--bg-color:#0a1128;--card-bg:#121b38;--primary:#e6c27a;--primary-dark:#cfa858;--border:#1f2d5a;--box-bg-1:#162248;--box-bg-2:#0a1128;--card-grad-1:#141e40;--card-grad-2:#0c132b;--shadow-1:#050814;--shadow-2:#17265a;--compass-bg:#0a1128}
[data-theme=green]{--bg-color:#061c13;--card-bg:#0b2b1d;--border:#14452f;--box-bg-1:#0d3625;--box-bg-2:#05170f;--card-grad-1:#0c3021;--card-grad-2:#071f15;--shadow-1:#030d09;--shadow-2:#0f3927;--compass-bg:#061c13}
[data-theme=burgundy]{--bg-color:#2b0b10;--card-bg:#3d1017;--primary:#e8b26a;--primary-dark:#c79450;--border:#5c1822;--box-bg-1:#4a131b;--box-bg-2:#21080c;--card-grad-1:#451119;--card-grad-2:#2b0b10;--shadow-1:#170608;--shadow-2:#4f151e;--compass-bg:#2b0b10}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',Tahoma,Arial,sans-serif;transition:background .4s,color .4s,border-color .4s}
html,body{height:100%;overscroll-behavior:none}
body{position:fixed;inset:0;height:100dvh}
body{background:var(--bg-color);color:var(--text-main);display:flex;justify-content:center;overflow:hidden}
.app-container{width:100%;max-width:480px;display:flex;flex-direction:column;height:100%;position:relative}
.header{padding:15px 20px;text-align:center}
.header h1{font-family:'Amiri',serif;font-size:28px;color:var(--primary);text-shadow:0 2px 4px rgba(0,0,0,.6)}
.content{flex:1;min-height:0;overflow-y:auto;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:16px 16px 80px}
.screen{display:none;animation:fadeIn .3s}.screen.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.location-frame{position:relative;height:130px;border-radius:16px;margin-bottom:20px;background:#222 center/cover no-repeat;box-shadow:0 8px 15px rgba(0,0,0,.5);border:2px solid var(--primary);display:flex;align-items:flex-end;padding:16px;overflow:hidden}
.location-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(18,18,18,.95),rgba(18,18,18,.1))}
.location-content{position:relative;width:100%}
.location-title{font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px;color:#fff}
.location-title svg{color:var(--primary)}
.location-subtitle{font-size:13px;color:#d1d5db;margin-top:4px;padding-right:32px}
.lower-section{position:relative;border-radius:16px;overflow:hidden;padding:16px;background:#222 center/cover no-repeat;margin-bottom:20px;border:1px solid var(--border)}
.lower-section::before{content:'';position:absolute;inset:0;background:rgba(0,0,0,.85)}
.lower-content{position:relative}
.next-prayer-card{background:linear-gradient(145deg,var(--card-grad-1),var(--card-grad-2));border:1px solid var(--border);border-radius:16px;padding:16px 20px;margin-bottom:20px;box-shadow:5px 5px 10px var(--shadow-1),-5px -5px 10px var(--shadow-2);display:flex;align-items:center;justify-content:space-between}
.next-prayer-title{color:var(--text-muted);font-size:14px;margin-bottom:6px}
.next-prayer-title span{color:var(--primary);font-weight:700;font-size:16px}
.countdown-timer{font-size:28px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums;letter-spacing:1px;direction:ltr;text-align:right}
.circle-container{width:60px;height:60px}
.circle-container svg{transform:rotate(-90deg);width:100%;height:100%}
.circle-bg{fill:none;stroke:#333;stroke-width:5}
.circle-progress{fill:none;stroke:var(--primary);stroke-width:5;stroke-dasharray:157.08;stroke-dashoffset:0;stroke-linecap:round;transition:stroke-dashoffset 1s linear,stroke .5s;filter:drop-shadow(0 0 3px var(--primary))}
@keyframes pulse-warning{0%,100%{filter:drop-shadow(0 0 5px #ff4d4d)}50%{filter:drop-shadow(0 0 15px var(--primary))}}
.warning-active .circle-progress{stroke:#ff4d4d!important;animation:pulse-warning 1.5s infinite}
.warning-active .countdown-timer{color:#ff4d4d;text-shadow:0 0 10px rgba(255,77,77,.6)}
.prayers-list{display:flex;flex-direction:column;gap:6px}
.prayer-box{background:linear-gradient(135deg,var(--box-bg-1),var(--box-bg-2));border-radius:8px;padding:6px 12px;display:flex;justify-content:space-between;align-items:center;box-shadow:2px 2px 4px rgba(0,0,0,.5),-1px -1px 3px rgba(255,215,0,.1);font-weight:800;font-size:14px;border:2px solid #ffea8c;outline:1px solid #735300;outline-offset:-3px}
.prayer-time{font-size:15px;font-weight:800;letter-spacing:1px;color:var(--primary)}
.card{background:var(--card-bg);border-radius:16px;padding:16px;margin-bottom:16px;border:1px solid var(--border);box-shadow:0 4px 6px rgba(0,0,0,.2)}
.compass-container{text-align:center;margin-top:20px}
.compass-circle{width:220px;height:220px;border:4px solid var(--primary);border-radius:50%;margin:0 auto;position:relative;display:flex;align-items:center;justify-content:center;background:var(--compass-bg);box-shadow:inset 0 0 20px rgba(0,0,0,.8)}
.kaaba{position:absolute;top:-46px;left:50%;font-size:26px;line-height:1;transform:translateX(-50%)}
.qibla-arrow{width:4px;height:62px;background:var(--primary);position:absolute;bottom:50%;transform-origin:bottom center;transition:transform .3s ease-out}
.qibla-arrow::after{content:'';position:absolute;top:-10px;left:-8px;border-left:10px solid transparent;border-right:10px solid transparent;border-bottom:15px solid var(--primary)}
.aligned .qibla-arrow,.aligned .qibla-arrow::after{background:#4ade80;border-bottom-color:#4ade80}
.aligned .compass-circle{border-color:#4ade80}
.compass-degree{margin-top:20px;font-size:24px;font-weight:700;color:var(--primary)}
.input-group{margin-bottom:16px}
.input-group label{display:block;margin-bottom:6px}
.input-group input,.input-group select{width:100%;padding:12px;border-radius:8px;border:1px solid var(--border);background:var(--bg-color);color:var(--text-main);outline:none;font-size:16px;font-weight:600}
.btn{width:100%;background:linear-gradient(145deg,var(--primary),var(--primary-dark));color:#121212;padding:14px;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;margin-top:10px}
.btn:active{transform:scale(.98)}
.btn-secondary{background:var(--card-bg);color:var(--primary);border:1px solid var(--primary);margin-top:6px}
.custom-upload-container{display:none;margin-top:10px}
.btn-upload{width:100%;background:transparent;color:var(--primary);padding:12px 30px;border:1px dashed var(--primary);border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.bottom-nav{position:absolute;bottom:0;left:0;right:0;background:var(--card-bg);display:flex;padding:12px 0;border-top:1px solid var(--border)}
.nav-item{text-align:center;color:var(--text-muted);cursor:pointer;flex:1;font-size:14px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px}
.nav-item.active{color:var(--primary)}
.nav-icon{font-size:22px}
</style>
</head>
<body>
<div class="app-container">
<div class="header"><h1 id="header-title">۞ مَوَاقِيتُ الصَّلَاةِ ۞</h1></div>
<div class="content">

<div id="screen-timings" class="screen active">
  <div class="location-frame" id="location-bg">
    <div class="location-overlay"></div>
    <div class="location-content">
      <div class="location-title">
        <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
        <span id="display-location">جاري التحديد...</span>
      </div>
      <div class="location-subtitle" id="hijri-date">--</div>
      <div id="landmark-name" style="font-size:11px;color:#d1d5db;padding-right:32px;opacity:.8"></div>
    </div>
  </div>
  <div class="lower-section" id="lower-section-bg"><div class="lower-content">
    <div class="next-prayer-card" id="next-prayer-card">
      <div>
        <div class="next-prayer-title">باقي على صلاة <span id="next-prayer-name">--</span></div>
        <div class="countdown-timer" id="countdown-timer">00:00:00</div>
      </div>
      <div class="circle-container"><svg viewBox="0 0 60 60"><circle class="circle-bg" cx="30" cy="30" r="25"></circle><circle class="circle-progress" id="prayer-progress" cx="30" cy="30" r="25"></circle></svg></div>
    </div>
    <div class="prayers-list">
      <div class="prayer-box"><span>الفجر</span><span class="prayer-time" id="Fajr">--:--</span></div>
      <div class="prayer-box"><span>الشروق</span><span class="prayer-time" id="Sunrise">--:--</span></div>
      <div class="prayer-box"><span>الظهر</span><span class="prayer-time" id="Dhuhr">--:--</span></div>
      <div class="prayer-box"><span>العصر</span><span class="prayer-time" id="Asr">--:--</span></div>
      <div class="prayer-box"><span>المغرب</span><span class="prayer-time" id="Maghrib">--:--</span></div>
      <div class="prayer-box"><span>العشاء</span><span class="prayer-time" id="Isha">--:--</span></div>
    </div>
  </div></div>
</div>

<div id="screen-qibla" class="screen">
  <div class="card compass-container">
    <p style="margin-bottom:20px;color:var(--text-muted)">ضع الهاتف بشكل مسطح للحصول على دقة أفضل</p>
    <div class="compass-circle" id="compass-circle"><div class="qibla-arrow" id="qibla-arrow"><span class="kaaba" id="kaaba">🕋</span></div></div>
    <div class="compass-degree" id="qibla-degree">--°</div>
    <p id="qibla-status" style="margin-top:15px;font-size:14px;color:var(--text-muted)">جاري حساب الاتجاه...</p>
    <button class="btn" id="compass-btn" style="display:none" onclick="enableCompass()">تفعيل البوصلة</button>
  </div>
</div>

<div id="screen-settings" class="screen">
  <div class="card">
    <div class="input-group">
      <label>مظهر التطبيق (الثيم)</label>
      <select id="theme-selector" onchange="changeTheme()">
        <option value="charcoal">الأسود الفحمي (الافتراضي)</option>
        <option value="blue">أزرق ليلي ملكي</option>
        <option value="green">أخضر زمردي</option>
        <option value="burgundy">أحمر عنابي (برغندي)</option>
      </select>
    </div>
    <div class="input-group" style="margin-top:20px">
      <label>صوت المؤذن</label>
      <select id="adhan-selector" onchange="saveAdhan()">
        <option value="makkah">أذان الحرم المكي</option>
        <option value="madinah">أذان الحرم المدني</option>
        <option value="aqsa">أذان المسجد الأقصى</option>
        <option value="abdulbasit">الأذان المصري (عبد الباسط)</option>
        <option value="custom">ملف صوتي من الجهاز 🎵</option>
      </select>
      <div id="custom-upload-section" class="custom-upload-container">
        <input type="file" id="custom-adhan-input" accept="audio/*" style="display:none" onchange="handleCustomAdhanUpload(event)">
        <button class="btn-upload" onclick="document.getElementById('custom-adhan-input').click()">
          <span>اختر ملف الصوت من هاتفك</span>
          <span id="custom-file-status" style="font-size:12px;font-weight:400;color:var(--text-muted)">(لم يتم اختيار ملف بعد)</span>
        </button>
      </div>
      <button class="btn btn-secondary" onclick="previewAdhan()">🔊 استماع تجريبي للصوت</button>
      <label style="display:flex;gap:8px;align-items:center;margin-top:14px;font-size:14px">
        <input type="checkbox" id="auto-adhan" onchange="localStorage.setItem('auto-adhan',this.checked?'1':'0')" style="width:auto"> تشغيل الأذان تلقائياً عند دخول الوقت (والصفحة مفتوحة)
      </label>
      <button class="btn btn-secondary" onclick="requestNotif()">🔔 تفعيل إشعار العد التنازلي في شريط الحالة</button>
      <button class="btn btn-secondary" onclick="testNative()">🧪 اختبار إشعار (بعد 10 ثوانٍ)</button>
      <p style="font-size:12px;color:var(--text-muted);text-align:center;margin-top:10px">الإصدار 5</p>
    </div>
  </div>
  <div class="card">
    <div class="input-group">
      <label>تحديد الموقع تلقائياً</label>
      <button class="btn" onclick="getLocationByGPS()">تحديث الموقع عبر GPS</button>
    </div>
    <hr style="border:0;border-top:1px solid var(--border);margin:20px 0">
    <div class="input-group"><label>المدينة (إنجليزي)</label><input type="text" id="manual-city" placeholder="مثال: Cairo"></div>
    <div class="input-group"><label>الدولة (إنجليزي)</label><input type="text" id="manual-country" placeholder="مثال: Egypt"></div>
    <button class="btn" onclick="saveManualLocation()">حفظ وتحديث المواقيت</button>
  </div>
</div>
</div>

<div class="bottom-nav">
  <div class="nav-item active" onclick="switchTab('timings',this,'۞ مَوَاقِيتُ الصَّلَاةِ ۞')"><span class="nav-icon">🕌</span>المواقيت</div>
  <div class="nav-item" onclick="switchTab('qibla',this,'اتجاه القبلة')"><span class="nav-icon">🧭</span>القبلة</div>
  <div class="nav-item" onclick="switchTab('settings',this,'الإعدادات')"><span class="nav-icon">⚙️</span>الإعدادات</div>
</div>
</div>

<script>
// ضع هنا روابط ملفات الأذان الصحيحة (mp3). الروابط الافتراضية غير مؤكدة، استبدلها بروابطك.
const ADHAN_URLS = {
  makkah: 'adhan.mp3', // ضع ملف adhan.mp3 داخل مجلد www بجانب index.html
  madinah: 'adhan.mp3',
  aqsa: 'adhan.mp3',
  abdulbasit: 'adhan.mp3'
};
const KEYS = ['Fajr','Sunrise','Dhuhr','Asr','Maghrib','Isha'];
const NAMES_AR = {Fajr:'الفجر',Sunrise:'الشروق',Dhuhr:'الظهر',Asr:'العصر',Maghrib:'المغرب',Isha:'العشاء'};
const store = {
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
};
let userLat = 30.0444, userLng = 31.2357;
let times = {}, loadedDay = '', lastSource = null;
let timerInterval, hasPlayedWarning = false, warningKey = '', adhanFiredFor = '';
const adhanAudio = new Audio();
let audioUnlocked = false;

// المتصفح يمنع الصوت قبل أي تفاعل، فنفتحه عند أول لمسة
document.addEventListener('click', () => {
  if (audioUnlocked) return;
  audioUnlocked = true;
  if ('speechSynthesis' in window) speechSynthesis.getVoices();
}, {once:true});

function localDayKey(d = new Date()) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function to12h(str) {
  const [h, m] = str.slice(0,5).split(':').map(Number);
  return ((h % 12) || 12) + ':' + String(m).padStart(2,'0') + ' ' + (h < 12 ? 'ص' : 'م');
}
function parseTime(str, base = new Date()) {
  const [h, m] = str.slice(0,5).split(':').map(Number);
  return new Date(base.getFullYear(), base.getMonth(), base.getDate(), h, m, 0);
}

function changeTheme() {
  const t = document.getElementById('theme-selector').value;
  document.documentElement.setAttribute('data-theme', t);
  store.set('app-theme', t);
}
function saveAdhan() {
  const a = document.getElementById('adhan-selector').value;
  store.set('app-adhan', a);
  document.getElementById('custom-upload-section').style.display = a === 'custom' ? 'block' : 'none';
  if (a === 'custom') checkCustomFileStatus();
}
function checkCustomFileStatus() {
  const el = document.getElementById('custom-file-status');
  if (store.get('app-adhan-custom-base64')) { el.textContent = '(تم حفظ الملف بنجاح ✔️)'; el.style.color = '#4ade80'; }
  else { el.textContent = '(لم يتم اختيار ملف بعد)'; el.style.color = 'var(--text-muted)'; }
}
function handleCustomAdhanUpload(e) {
  const f = e.target.files[0];
  if (!f) return;
  if (f.size > 3.5*1024*1024) { alert('حجم الملف كبير جداً! اختر ملفاً أصغر من 3.5 ميجابايت.'); return; }
  const r = new FileReader();
  r.onload = ev => {
    if (store.set('app-adhan-custom-base64', ev.target.result)) { checkCustomFileStatus(); alert('تم حفظ ملف الأذان بنجاح!'); }
    else alert('تعذر حفظ الملف، المساحة التخزينية غير كافية.');
  };
  r.readAsDataURL(f);
}
function adhanSource() {
  const a = document.getElementById('adhan-selector').value;
  if (a === 'custom') return store.get('app-adhan-custom-base64');
  return ADHAN_URLS[a] || ADHAN_URLS.makkah;
}
let previewTimer;
function previewAdhan() {
  if (!adhanAudio.paused) { adhanAudio.pause(); adhanAudio.currentTime = 0; clearTimeout(previewTimer); return; }
  const src = adhanSource();
  if (!src) { alert('الرجاء اختيار ملف صوتي من الجهاز أولاً.'); return; }
  adhanAudio.src = src;
  adhanAudio.play().catch(() => alert('تعذر تشغيل الصوت. تحقق من الإنترنت أو من رابط/ملف الأذان.'));
  previewTimer = setTimeout(() => { adhanAudio.pause(); adhanAudio.currentTime = 0; }, 15000);
}
function playAdhanNow() {
  const src = adhanSource();
  if (!src) return;
  adhanAudio.src = src;
  adhanAudio.play().catch(() => {});
}

function updateLocationBackground(tz) {
  if (!tz) return;
  let url = 'https://images.unsplash.com/photo-1584286595398-a59f21d313f5?auto=format&fit=crop&q=80&w=800';
  if (/Cairo|Egypt/.test(tz)) url = 'https://images.unsplash.com/photo-1531604250646-2f0e818c4f06?auto=format&fit=crop&q=80&w=800';
  else if (/Riyadh|Mecca|Saudi/.test(tz)) url = 'https://images.unsplash.com/photo-1565552643983-665ab2790930?auto=format&fit=crop&q=80&w=800';
  document.getElementById('location-bg').style.backgroundImage = `url('${url}')`;
  document.getElementById('lower-section-bg').style.backgroundImage = `url('${url}')`;
}

// يبحث في ويكيبيديا العربية عن أقرب مسجد/معلم إسلامي له صورة حول إحداثيات الموقع
function setBackground(url) {
  const img = new Image();
  img.onload = () => {
    document.getElementById('location-bg').style.backgroundImage = `url("${url}")`;
    document.getElementById('lower-section-bg').style.backgroundImage = `url("${url}")`;
  };
  img.src = url;
}
async function findMosqueImage(lang, lat, lng, re) {
  const base = `https://${lang}.wikipedia.org/w/api.php?format=json&origin=*&action=query`;
  // 1) كل الصفحات القريبة (حتى 500) ثم نختار المساجد فقط
  const g = await (await fetch(`${base}&list=geosearch&gscoord=${lat}|${lng}&gsradius=10000&gslimit=500`)).json();
  const titles = ((g.query && g.query.geosearch) || []).filter(x => re.test(x.title)).slice(0, 15).map(x => x.title);
  if (!titles.length) return null;
  // 2) نجلب صورها ونختار الأقرب الذي له صورة
  const q = await (await fetch(`${base}&prop=pageimages&piprop=thumbnail&pithumbsize=800&titles=${encodeURIComponent(titles.join('|'))}`)).json();
  const pages = (q.query && q.query.pages) || {};
  for (const t of titles) {
    const pg = Object.values(pages).find(p => p.title === t && p.thumbnail);
    if (pg) return pg.thumbnail.source;
  }
  return null;
}
const CITY_LANDMARKS = {mecca:'Masjid al-Haram', makkah:'Masjid al-Haram', medina:"Al-Masjid an-Nabawi", madinah:"Al-Masjid an-Nabawi", jerusalem:'Al-Aqsa Mosque', istanbul:'Sultan Ahmed Mosque', casablanca:'Hassan II Mosque', 'abu dhabi':'Sheikh Zayed Grand Mosque', cairo:'Muhammad Ali Mosque', alexandria:'Abu al-Abbas al-Mursi Mosque', tanta:'Al-Sayyid al-Badawi Mosque'};
const TZ_LANDMARKS = {'Africa/Cairo':'Muhammad Ali Mosque','Asia/Riyadh':'Masjid al-Haram','Europe/Istanbul':'Sultan Ahmed Mosque','Asia/Dubai':'Sheikh Zayed Grand Mosque','Africa/Casablanca':'Hassan II Mosque','Asia/Jakarta':'Istiqlal Mosque, Jakarta','Asia/Karachi':'Badshahi Mosque','Asia/Kuala_Lumpur':'National Mosque of Malaysia','Asia/Kuwait':'Grand Mosque (Kuwait)','Asia/Amman':'King Abdullah I Mosque','Asia/Baghdad':'Al-Kadhimiya Mosque','Asia/Muscat':'Sultan Qaboos Grand Mosque','Africa/Tunis':'Zitouna Mosque','Asia/Dhaka':'Baitul Mukarram','Asia/Kolkata':'Jama Masjid, Delhi'};
async function imageForTitle(title) {
  const u = 'https://en.wikipedia.org/w/api.php?format=json&origin=*&action=query&redirects=1&prop=pageimages&piprop=thumbnail&pithumbsize=800&titles=' + encodeURIComponent(title);
  const d = await (await fetch(u)).json();
  const pg = Object.values((d.query && d.query.pages) || {}).find(p => p.thumbnail);
  return pg ? pg.thumbnail.source : null;
}
function loadImage(url) {
  return new Promise(res => { const i = new Image(); i.onload = () => res(true); i.onerror = () => res(false); i.src = url; });
}
async function applyLandmark(url, name) {
  if (!url || !(await loadImage(url))) return false;
  document.getElementById('location-bg').style.backgroundImage = `url("${url}")`;
  document.getElementById('lower-section-bg').style.backgroundImage = `url("${url}")`;
  document.getElementById('landmark-name').textContent = name || '';
  return true;
}
let landmarkRun = 0;
async function updateLandmark(lat, lng, tz) {
  const run = ++landmarkRun;
  const cap = document.getElementById('landmark-name');
  const city = (lastSource && lastSource.type === 'city') ? lastSource.city.toLowerCase() : '';
  const tries = [];
  if (CITY_LANDMARKS[city]) tries.push(() => imageForTitle(CITY_LANDMARKS[city]).then(u => [u, CITY_LANDMARKS[city]]));
  tries.push(async () => [await findMosqueImage('ar', lat, lng, /مسجد|جامع|الحرم|ضريح/), 'أقرب معلم إسلامي']);
  tries.push(async () => [await findMosqueImage('en', lat, lng, /mosque|masjid|jama|mausoleum/i), 'Nearest mosque']);
  if (TZ_LANDMARKS[tz]) tries.push(() => imageForTitle(TZ_LANDMARKS[tz]).then(u => [u, TZ_LANDMARKS[tz]]));
  for (const t of tries) {
    try {
      const [url, name] = await t();
      if (run !== landmarkRun) return;
      if (await applyLandmark(url, name)) return;
    } catch (e) { console.error('landmark', e); }
  }
  cap.textContent = '(تعذر جلب صورة المعلم، تحقق من الإنترنت)';
  updateLocationBackground(tz);
}

function switchTab(id, el, title) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
  el.classList.add('active');
  document.getElementById('header-title').textContent = title;
  if (id === 'qibla') initQibla();
}

// تطبيق بيانات المواقيت (مشترك بين المدينة و GPS)
function applyTimings(data, label) {
  const t = data.data.timings, h = data.data.date.hijri, now = new Date();
  KEYS.forEach(p => {
    document.getElementById(p).textContent = to12h(t[p]);
    times[p] = parseTime(t[p], now);
  });
  loadedDay = localDayKey(now);
  document.getElementById('hijri-date').textContent = `${h.day} ${h.month.ar} ${h.year} هـ`;
  document.getElementById('display-location').textContent = label;
  if (data.data.meta) updateLandmark(data.data.meta.latitude, data.data.meta.longitude, data.data.meta.timezone);
  startCountdown();
  scheduleNative();
}

async function fetchByCity(city, country) {
  lastSource = {type:'city', city, country};
  try {
    const url = `https://api.aladhan.com/v1/timingsByCity?city=${encodeURIComponent(city)}&country=${encodeURIComponent(country)}&method=5`;
    const data = await (await fetch(url)).json();
    const ar = {Cairo:'القاهرة', Buraydah:'بريدة', Egypt:'مصر', 'Saudi Arabia':'السعودية'};
    applyTimings(data, `${ar[city] || city}، ${ar[country] || country}`);
  } catch (e) {
    document.getElementById('display-location').textContent = 'تعذر جلب المواقيت، تحقق من الإنترنت';
  }
}
async function fetchByCoords(lat, lng, label) {
  lastSource = {type:'gps', lat, lng};
  try {
    const data = await (await fetch(`https://api.aladhan.com/v1/timings?latitude=${lat}&longitude=${lng}&method=5`)).json();
    applyTimings(data, label);
  } catch (e) {
    document.getElementById('display-location').textContent = 'تعذر جلب المواقيت، تحقق من الإنترنت';
  }
}
function refetchToday() {
  if (!lastSource) return;
  if (lastSource.type === 'city') fetchByCity(lastSource.city, lastSource.country);
  else fetchByCoords(lastSource.lat, lastSource.lng, 'موقعك الحالي (GPS)');
}

function startCountdown() {
  clearInterval(timerInterval);
  timerInterval = setInterval(updateCountdown, 1000);
  updateCountdown();
}

function updateCountdown() {
  if (!times.Fajr) return;
  const now = new Date();
  // تحديث المواقيت تلقائياً عند تغيّر اليوم
  if (localDayKey(now) !== loadedDay) { loadedDay = localDayKey(now); refetchToday(); return; }

  let idx = KEYS.findIndex(k => now < times[k]);
  let nextKey, nextTime, prevTime;
  if (idx === -1) { // بعد العشاء: فجر الغد تقريبياً، ويتحدّث بعد منتصف الليل
    nextKey = 'Fajr';
    nextTime = new Date(times.Fajr.getTime() + 86400000);
    prevTime = times.Isha;
  } else {
    nextKey = KEYS[idx];
    nextTime = times[nextKey];
    prevTime = idx === 0 ? new Date(times.Isha.getTime() - 86400000) : times[KEYS[idx-1]];
  }
  document.getElementById('next-prayer-name').textContent = NAMES_AR[nextKey];

  const diff = nextTime - now;
  const h = Math.floor(diff/3600000), m = Math.floor(diff/60000) % 60, s = Math.floor(diff/1000) % 60;
  const p2 = n => String(n).padStart(2,'0');
  document.getElementById('countdown-timer').textContent = `${p2(h)}:${p2(m)}:${p2(s)}`;

  const card = document.getElementById('next-prayer-card');
  const key = localDayKey(now) + nextKey;
  if (diff <= 15*60000 && diff > 0) {
    document.title = `⏳ ${m}:${p2(s)} - اقتربت صلاة ${NAMES_AR[nextKey]}`;
    card.classList.add('warning-active');
    const mins = Math.ceil(diff/60000);
    if (mins !== lastNotifMin) { lastNotifMin = mins; showCountdownNotif(NAMES_AR[nextKey], mins); }
    if (!hasPlayedWarning || warningKey !== key) {
      speak(`اقتربت صلاة ${NAMES_AR[nextKey]}`);
      hasPlayedWarning = true; warningKey = key;
    }
  } else {
    document.title = 'تطبيق الصلاة والقبلة';
    card.classList.remove('warning-active');
    if (lastNotifMin !== -1) { lastNotifMin = -1; clearCountdownNotif(); }
  }

  // تشغيل الأذان عند دخول الوقت (إن فُعّل الخيار)، مرة واحدة لكل صلاة
  if (idx !== -1 || true) {
    KEYS.forEach(k => {
      if (k === 'Sunrise') return;
      const delta = now - times[k];
      const id = localDayKey(now) + k;
      if (delta >= 0 && delta < 5000 && adhanFiredFor !== id) {
        adhanFiredFor = id;
        if (store.get('auto-adhan') === '1') playAdhanNow();
      }
    });
  }

  document.getElementById('prayer-progress').style.strokeDashoffset = 157.08 * (1 - diff / (nextTime - prevTime));
}

// ===== جدولة إشعارات أندرويد الأصلية (تعمل والتطبيق مغلق) =====
const USE_ADHAN_SOUND = false; // غيّرها إلى true بعد وضع adhan.mp3 في resources/raw
const isNative = () => window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform();
let schedTimer;
function scheduleNative() { clearTimeout(schedTimer); schedTimer = setTimeout(doSchedule, 1500); }
async function testNative() {
  if (!isNative()) { alert('هذا الاختبار يعمل داخل تطبيق أندرويد فقط.'); return; }
  const LN = Capacitor.Plugins.LocalNotifications;
  try {
    const p = await LN.requestPermissions();
    if (p.display !== 'granted') { alert('إذن الإشعارات غير ممنوح. فعّله من إعدادات الهاتف.'); return; }
    await LN.createChannel({id:'test', name:'اختبار', importance:5, vibration:true});
    await LN.schedule({notifications:[{id:999, title:'اختبار الإشعار', body:'إذا ظهرت هذه الرسالة بصوت وأيقونة فكل شيء يعمل', channelId:'test', smallIcon:'ic_stat_icon', schedule:{at:new Date(Date.now()+10000), allowWhileIdle:true}}]});
    alert('سيصلك إشعار بعد 10 ثوانٍ. اترك التطبيق مفتوحاً أو أغلق الشاشة.');
  } catch (e) { alert('خطأ: ' + e); }
}
async function startLiveService(all) {
  const PL = Capacitor.Plugins.PrayerLive;
  if (!PL) return;
  all.sort((a, b) => a.t - b.t);
  await PL.start({items: all.slice(0, 35).map(x => ({name: NAMES_AR[x.k], at: x.t.getTime()}))});
}
async function doSchedule() {
  if (!isNative() || !lastSource) return;
  const LN = Capacitor.Plugins.LocalNotifications;
  if (!LN) return;
  try {
    const perm = await LN.requestPermissions();
    if (perm.display !== 'granted') return;
    try { await LN.requestExactAlarmPermission(); } catch (e) {}
    const pend = await LN.getPending();
    if (pend.notifications.length) await LN.cancel({notifications: pend.notifications});
    await LN.createChannel({id:'reminder', name:'تنبيه قبل الصلاة', importance:4, vibration:true});
    await LN.createChannel(USE_ADHAN_SOUND
      ? {id:'adhan-sound', name:'الأذان', importance:5, vibration:true, sound:'adhan.mp3'}
      : {id:'adhan', name:'وقت الصلاة', importance:5, vibration:true});
    const now = new Date(), limit = now.getTime() + 7*86400000, items = [], all = [];
    for (const off of [0, 1]) {
      const d = new Date(now.getFullYear(), now.getMonth() + off, 1);
      const y = d.getFullYear(), mo = d.getMonth() + 1;
      const url = lastSource.type === 'city'
        ? `https://api.aladhan.com/v1/calendarByCity/${y}/${mo}?city=${encodeURIComponent(lastSource.city)}&country=${encodeURIComponent(lastSource.country)}&method=5`
        : `https://api.aladhan.com/v1/calendar/${y}/${mo}?latitude=${lastSource.lat}&longitude=${lastSource.lng}&method=5`;
      const cal = await (await fetch(url)).json();
      (cal.data || []).forEach(day => {
        const g = day.date.gregorian;
        KEYS.forEach(k => {
          const [hh, mm] = day.timings[k].slice(0,5).split(':').map(Number);
          const t = new Date(+g.year, g.month.number - 1, +g.day, hh, mm, 0);
          if (t.getTime() > now.getTime() && t.getTime() < limit) { all.push({k, t}); if (k !== 'Sunrise') items.push({k, t}); }
        });
      });
    }
    const list = []; let id = 1;
    items.forEach(({k, t}) => {
      const warn = new Date(t.getTime() - 15*60000);
      if (warn > now) list.push({id: id++, title: `اقتربت صلاة ${NAMES_AR[k]}`, body: 'باقي 15 دقيقة', channelId: 'reminder', smallIcon: 'ic_stat_icon', schedule: {at: warn, allowWhileIdle: true}});
      list.push({id: id++, title: `حان وقت صلاة ${NAMES_AR[k]}`, body: 'حيّ على الصلاة', channelId: USE_ADHAN_SOUND ? 'adhan-sound' : 'adhan', smallIcon: 'ic_stat_icon', schedule: {at: t, allowWhileIdle: true}});
    });
    if (list.length) await LN.schedule({notifications: list.slice(0, 60)});
    await startLiveService(all);
  } catch (e) {
    console.error('schedule', e);
    try { await startLiveService(KEYS.map(k => ({k, t: times[k]})).filter(x => x.t && x.t > new Date())); } catch (e2) {}
  }
}

// ===== إشعار شريط الحالة: أيقونة تتحول إلى رقم الدقائق المتبقية =====
let lastNotifMin = -1, swReg = null;
function makeBadge(n) {
  const c = document.createElement('canvas'); c.width = c.height = 96;
  const x = c.getContext('2d');
  x.fillStyle = '#fff'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.font = 'bold 72px sans-serif'; x.fillText(String(n), 48, 52);
  return c.toDataURL('image/png');
}
async function getReg() {
  if (swReg) return swReg;
  try { return (navigator.serviceWorker && await navigator.serviceWorker.getRegistration()) || null; } catch (e) { return null; }
}
async function showCountdownNotif(name, mins) {
  try { navigator.setAppBadge && navigator.setAppBadge(mins); } catch (e) {}
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const icon = makeBadge(mins);
  const title = `اقتربت صلاة ${name}`;
  const opts = {body: `باقي ${mins} دقيقة`, tag: 'prayer-countdown', renotify: false, silent: true, icon, badge: icon};
  try {
    const reg = await getReg();
    if (reg) await reg.showNotification(title, opts); else new Notification(title, opts);
  } catch (e) { console.error('notif', e); }
}
async function clearCountdownNotif() {
  try { navigator.clearAppBadge && navigator.clearAppBadge(); } catch (e) {}
  try {
    const reg = await getReg();
    if (reg) (await reg.getNotifications({tag: 'prayer-countdown'})).forEach(n => n.close());
  } catch (e) {}
}
async function requestNotif() {
  if (isNative()) {
    try {
      const LN = Capacitor.Plugins.LocalNotifications;
      const p = await LN.requestPermissions();
      if (p.display !== 'granted') { alert('إذن الإشعارات غير ممنوح. فعّله من إعدادات الهاتف ثم أعد المحاولة.'); return; }
      if (!Capacitor.Plugins.PrayerLive) { alert('خدمة الإشعار الدائم غير موجودة في هذه النسخة. ثبّت الإصدار الأحدث (يجب أن يظهر الإصدار 5 في الإعدادات).'); return; }
      await doSchedule();
      alert('تم التفعيل. تحقق من شريط الحالة.');
    } catch (e) { alert('خطأ: ' + e); }
    return;
  }
  if (!('Notification' in window)) { alert('المتصفح لا يدعم الإشعارات.'); return; }
  const r = await Notification.requestPermission();
  alert(r === 'granted' ? 'تم تفعيل الإشعارات.' : 'لم يتم منح إذن الإشعارات.');
}
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker.register('sw.js').then(r => swReg = r).catch(() => {});
}

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ar-SA'; u.rate = 0.85; u.pitch = 0.9;
  speechSynthesis.speak(u);
}

function saveManualLocation() {
  const city = document.getElementById('manual-city').value.trim();
  const country = document.getElementById('manual-country').value.trim();
  if (!city || !country) { alert('أدخل المدينة والدولة.'); return; }
  store.set('userCity', city); store.set('userCountry', country);
  fetchByCity(city, country);
  switchTab('timings', document.querySelectorAll('.nav-item')[0], '۞ مَوَاقِيتُ الصَّلَاةِ ۞');
}
function getLocationByGPS() {
  if (!navigator.geolocation) { alert('المتصفح لا يدعم تحديد الموقع.'); return; }
  document.getElementById('display-location').textContent = 'جاري البحث...';
  navigator.geolocation.getCurrentPosition(pos => {
    userLat = pos.coords.latitude; userLng = pos.coords.longitude;
    fetchByCoords(userLat, userLng, 'موقعك الحالي (GPS)');
    switchTab('timings', document.querySelectorAll('.nav-item')[0], '۞ مَوَاقِيتُ الصَّلَاةِ ۞');
  }, () => alert('يرجى تفعيل الـ GPS وإعطاء الصلاحية.'));
}

// ===== القبلة =====
let qiblaAngle = 0, compassListening = false;
function calcQibla() {
  const r = Math.PI/180, mLat = 21.422487*r, mLng = 39.826206*r, lat = userLat*r, lng = userLng*r;
  const y = Math.sin(mLng - lng);
  const x = Math.cos(lat)*Math.tan(mLat) - Math.sin(lat)*Math.cos(mLng - lng);
  return (Math.atan2(y, x)*180/Math.PI + 360) % 360;
}
function setArrow(rot, live) {
  document.getElementById('qibla-arrow').style.transform = `rotate(${rot}deg)`;
  document.getElementById('kaaba').style.transform = `translateX(-50%) rotate(${-rot}deg)`; // تبقى الكعبة منتصبة
  if (!live) return;
  const off = ((rot % 360) + 540) % 360 - 180; // الفرق عن اتجاه القبلة
  const ok = Math.abs(off) <= 4;
  document.getElementById('compass-circle').parentElement.classList.toggle('aligned', ok);
  document.getElementById('qibla-status').textContent = ok ? 'أنت تواجه الكعبة المشرفة 🕋' : 'أدر الهاتف حتى يشير السهم للأعلى نحو الكعبة';
}
function onOrientation(e) {
  let heading = null;
  if (typeof e.webkitCompassHeading === 'number') heading = e.webkitCompassHeading;       // iOS
  else if (e.absolute && typeof e.alpha === 'number') heading = (360 - e.alpha) % 360;     // Android
  if (heading === null) return;
  setArrow(qiblaAngle - heading, true);
}
function startCompassListeners() {
  if (compassListening) return; // لا نكرر المستمع
  compassListening = true;
  window.addEventListener('deviceorientationabsolute', onOrientation);
  window.addEventListener('deviceorientation', onOrientation);
}
async function enableCompass() {
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      const res = await DeviceOrientationEvent.requestPermission();
      if (res !== 'granted') { document.getElementById('qibla-status').textContent = 'تم رفض إذن البوصلة'; return; }
    }
    startCompassListeners();
    document.getElementById('compass-btn').style.display = 'none';
  } catch (e) { document.getElementById('qibla-status').textContent = 'تعذر تفعيل البوصلة'; }
}
function initQibla() {
  qiblaAngle = calcQibla();
  document.getElementById('qibla-degree').textContent = Math.round(qiblaAngle) + '°';
  setArrow(qiblaAngle, false); // الاتجاه من الشمال حتى تتوفر البوصلة
  if (!window.DeviceOrientationEvent) { document.getElementById('qibla-status').textContent = 'جهازك لا يدعم البوصلة، الزاوية من الشمال'; return; }
  if (typeof DeviceOrientationEvent.requestPermission === 'function') {
    document.getElementById('compass-btn').style.display = 'block';
    document.getElementById('qibla-status').textContent = 'اضغط تفعيل البوصلة';
  } else startCompassListeners();
}

// منع السحب للتحديث (Pull-to-refresh) مع بقاء التمرير داخل المحتوى
(function () {
  const content = document.querySelector('.content');
  let startY = 0;
  content.addEventListener('touchstart', e => { startY = e.touches[0].clientY; }, {passive: true});
  content.addEventListener('touchmove', e => {
    if (content.scrollTop <= 0 && e.touches[0].clientY > startY && e.cancelable) e.preventDefault();
  }, {passive: false});
  document.addEventListener('touchmove', e => {
    if (!e.target.closest('.content') && e.cancelable) e.preventDefault();
  }, {passive: false});
})();
