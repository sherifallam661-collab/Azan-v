name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - name: Manifest permissions and service
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#  <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n  <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n  <uses-permission android:name="android.permission.VIBRATE"/>\n  <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n  <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"/>\n</manifest>#' $M
          sed -i 's#</application>#  <service android:name=".PrayerService" android:exported="false" android:foregroundServiceType="dataSync"/>\n</application>#' $M
          cp native/*.java android/app/src/main/java/com/example/prayerqibla/
          ls android/app/src/main/java/com/example/prayerqibla/
          cat $M
      - name: Launcher icon and notification icon
        run: |
          set -e
          test -f icon.png
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26 $R/drawable-v24/ic_launcher_foreground.xml $R/drawable/ic_launcher_background.xml
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${pair%%:*}; s=${pair##*:}
            mkdir -p $R/mipmap-$d
            convert icon.png -resize ${s}x${s} $R/mipmap-$d/ic_launcher.png
            cp $R/mipmap-$d/ic_launcher.png $R/mipmap-$d/ic_launcher_round.png
          done
          mkdir -p $R/drawable $R/raw
          cat > $R/drawable/ic_stat_icon.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFFFF" android:pathData="M12,3a9,9 0 1,0 9,9c0,-0.46 -0.04,-0.92 -0.1,-1.36 -0.98,1.37 -2.58,2.26 -4.4,2.26 -2.98,0 -5.4,-2.42 -5.4,-5.4 0,-1.81 0.89,-3.42 2.26,-4.4C12.92,3.04 12.46,3 12,3z"/>
          </vector>
          XML
          cp -n resources/raw/* $R/raw/ 2>/dev/null || true
          ls $R/mipmap-xxxhdpi $R/drawable
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: prayer-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
